name: CheckLoss QA e GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "styles.css"
      - "app.js"
      - "sample-data.json"
      - "favicon.svg"
      - "package.json"
      - "playwright.config.cjs"
      - "tests/**"
      - ".github/workflows/pages.yml"
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "checkloss-pages-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar dependencias de QA
        run: npm install --no-audit --no-fund
      - name: Preparar Chromium
        run: npx playwright install --with-deps chromium
      - name: Testes desktop e mobile
        run: npm test
      - name: Capturas e relatorio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkloss-playwright
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
      - name: Verificar se GitHub Pages foi habilitado manualmente
        id: pages
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mode="$(gh api "repos/${{ github.repository }}/pages" --jq '.build_type // "legacy"' 2>/dev/null || echo unavailable)"
          if [ "$mode" = "workflow" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Pages configurado para GitHub Actions: publicacao via workflow autorizada." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Publicacao separada::Pages em modo $mode. O QA passou; use a branch gh-pages, ou altere Settings > Pages > GitHub Actions se quiser publicar pelo workflow."
            echo "QA aprovado. Pages em modo $mode: a branch gh-pages publica a versao estatica; o deploy do workflow foi ignorado intencionalmente." >> "$GITHUB_STEP_SUMMARY"
          fi
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.test.outputs.pages_enabled == 'true'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Preparar arquivos estaticos
        run: |
          mkdir -p _site
          cp index.html styles.css app.js sample-data.json favicon.svg .nojekyll _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
