name: checkLoss - QA Playwright e GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checkloss-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar sintaxe
        run: node --check app.js
      - name: Instalar Playwright
        run: npm install --no-audit --no-fund
      - name: Instalar navegador Chromium
        run: npx playwright install --with-deps chromium
      - name: Testar CRUD, armazenamento, visual e JS
        run: npm run qa
      - name: Salvar capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkloss-visual-${{ github.run_id }}
          path: screenshots/
          if-no-files-found: ignore
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: qa
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Preparar apenas arquivos publicos estaticos
        run: |
          mkdir -p dist-pages
          cp index.html styles.css app.js favicon.svg dist-pages/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist-pages
      - id: deploy
        uses: actions/deploy-pages@v4
